<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: #e8e8ea; background: transparent; }
  .row { display: flex; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 5px; margin-right: 8px; background: #6b6e76; }
  .dot.on { background: #3dd68c; }
  .dot.warn { background: #f5a524; }
  .dot.app { background: #4c8dff; }
  .title { font-size: 13px; font-weight: 700; }
  .muted { color: #9a9ca3; margin-top: 4px; line-height: 1.4; }
  .big { font-size: 22px; font-weight: 700; margin-top: 10px; font-family: Menlo, Consolas, monospace; }
  .mission { margin-top: 8px; font-weight: 600; }
  input, select { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 6px 8px; font-size: 12px; }
  button { margin-top: 8px; padding: 6px 10px; font-size: 12px; }
  .link { margin-top: 12px; color: #9a9ca3; font-size: 11px; text-decoration: underline; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="login" class="hidden">
    <div class="title">Minima Studio</div>
    <div class="muted">Colle ici ton code de connexion. Tu le trouves dans Minima Studio, Mon compte, « Panneau Premiere ».</div>
    <input id="code" placeholder="XXXX-XXXX-XXXX" maxlength="14">
    <button id="save">Connecter</button>
    <div id="loginErr" class="muted"></div>
  </div>

  <div id="main" class="hidden">
    <div class="row"><div id="dot" class="dot"></div><div id="state" class="title">Connexion…</div></div>
    <div id="mission" class="mission"></div>
    <div id="today" class="big"></div>
    <div id="hint" class="muted"></div>
    <div id="linkBox" class="hidden">
      <select id="missions"></select>
      <button id="link">Lier ce projet à la mission</button>
    </div>
    <div id="logout" class="link">Changer de compte</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
