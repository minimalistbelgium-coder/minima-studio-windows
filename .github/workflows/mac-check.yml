name: Vérifier la compilation Mac

on:
  push:
    branches: [mac]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        id: build
        run: |
          cd mac
          swift --version 2>&1 | tee ../build.log
          set +e
          swift build -c release 2>&1 | tee -a ../build.log
          rc=${PIPESTATUS[0]}
          echo "RESULTAT=$rc" >> ../build.log
          echo "code=$rc" >> "$GITHUB_OUTPUT"
      - name: Publier le journal
        if: always()
        run: |
          grep -nE "error:|RESULTAT=|Build complete|Compiling|warning: var|Swift version" build.log | grep -vE "^[0-9]+:\[[0-9]+/[0-9]+\] Compiling" | tail -150 > short.log || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan mac-log
          git rm -rfq --cached .
          git add -f build.log short.log
          git commit -qm "Journal de compilation"
          git push -f origin mac-log
      - name: Résultat
        run: exit ${{ steps.build.outputs.code }}
