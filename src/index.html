<!doctype html>

<title>Minima Studio</title>
<meta name="description" content="Espace Minima Studio : suivi des projets Minimalist Belgium.">
<meta name="theme-color" content="#0A0B0E">
<meta name="color-scheme" content="dark light">
<script>
// Applique le thème avant le premier affichage : choix mémorisé, sinon celui du système.
(function () {
  var t = null;
  try { t = localStorage.getItem('msTheme'); } catch (e) { /* stockage indisponible */ }
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#ECEEF3' : '#0A0B0E');
})();
</script>
