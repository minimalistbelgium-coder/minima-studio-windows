<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0A0B0E; --card: #15161A; --card2: #1C1D22; --line: #26272D;
    --text: #EDEEF0; --muted: #8F929A; --faint: #5B5E66;
    --blue: #4C8DFF; --green: #3DD68C; --amber: #F5A524; --red: #FF6B6B;
  }
  body { margin: 0; padding: 12px; background-color: #0A0B0E; color: #EDEEF0;
         font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif; font-size: 12px; }
  .hidden { display: none; }
  .row { display: flex; flex-direction: row; align-items: center; }
  .grow { flex: 1; }

  .top { display: flex; flex-direction: row; align-items: center; margin-bottom: 10px; }
  .logo { width: 18px; height: 16px; margin-right: 8px; }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #EDEEF0; }
  .pill { display: flex; flex-direction: row; align-items: center; padding: 3px 8px; border-radius: 10px;
          background-color: #1C1D22; border: 1px solid #26272D; font-size: 10.5px; font-weight: 600; color: #C9CBD1; }
  .dot { width: 7px; height: 7px; border-radius: 4px; margin-right: 6px; background-color: #5B5E66; }
  .dot.on { background-color: #3DD68C; }
  .dot.warn { background-color: #F5A524; }
  .dot.app { background-color: #4C8DFF; }
  .dot.off { background-color: #FF6B6B; }

  .card { background-color: #15161A; border: 1px solid #26272D; border-radius: 12px; padding: 12px 14px; }
  .card.on { border-color: #1F5E43; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #8F929A; }
  .mission { font-size: 14px; font-weight: 700; color: #EDEEF0; margin-top: 4px; }
  .client { font-size: 11.5px; color: #8F929A; margin-top: 2px; }
  .clock { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 34px; font-weight: 700;
           letter-spacing: 1px; color: #EDEEF0; margin-top: 10px; }
  .clock.on { color: #3DD68C; }
  .clock.app { color: #8DB6FF; }
  .clock.idle { color: #8F929A; }
  .sub { font-size: 11px; color: #8F929A; margin-top: 2px; }
  .hint { font-size: 11.5px; color: #8F929A; margin-top: 10px; line-height: 16px; }

  input, select { width: 100%; margin-top: 8px; padding: 7px 9px; font-size: 12px; color: #EDEEF0;
                  background-color: #1C1D22; border: 1px solid #26272D; border-radius: 8px; }
  .btn { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background-color: #4C8DFF; color: #06101F;
         font-size: 12px; font-weight: 700; text-align: center; cursor: pointer; }
  .link { margin-top: 12px; color: #5B5E66; font-size: 10.5px; cursor: pointer; }
  .err { color: #FF6B6B; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="top">
    <img class="logo" src="icons/logo.png">
    <div class="brand grow">MINIMA STUDIO</div>
    <div id="pill" class="pill hidden"><div id="dot" class="dot"></div><div id="state">Connexion…</div></div>
  </div>

  <div id="login" class="hidden">
    <div class="card">
      <div class="label">CONNEXION</div>
      <div class="hint">Colle ton code personnel. Tu le trouves dans Minima Studio, menu de ton compte, « Panneau Premiere ».</div>
      <input id="code" placeholder="XXXX-XXXX-XXXX" maxlength="14">
      <div id="save" class="btn">Connecter</div>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <div id="main" class="hidden">
    <div id="card" class="card">
      <div class="label">AUJOURD'HUI SUR CETTE MISSION</div>
      <div id="mission" class="mission"></div>
      <div id="client" class="client"></div>
      <div id="clock" class="clock idle">0:00:00</div>
      <div id="sub" class="sub"></div>
    </div>
    <div id="hint" class="hint"></div>
    <div id="linkBox" class="hidden">
      <select id="missions"></select>
      <div id="link" class="btn">Lier ce projet à la mission</div>
    </div>
    <div id="logout" class="link">Changer de compte</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
